name: Fix Club Brinky freeze

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-freeze]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove recursive MutationObserver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = 'const observer=new MutationObserver(()=>{setupClub();enhance()});'
          old2 = 'observer.observe(document.body,{subtree:true,childList:true})'
          if old1 not in s or old2 not in s:
              raise SystemExit('No se encontró el código problemático')
          s = s.replace(old1, '')
          s = s.replace(old2, '')
          s = s.replace('v2.2.4', 'v2.2.5', 1)
          s = s.replace('styles.css?v=2.2.4', 'styles.css?v=2.2.5')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Club Brinky freeze and bump to v2.2.5"
          git rm .github/workflows/fix-freeze.yml
          git commit -m "Remove temporary freeze fix workflow"
          git push
