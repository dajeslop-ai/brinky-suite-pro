name: Run Club Brinky redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[run-club-redesign]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute prepared patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          wf=Path('.github/workflows/apply-club-card-redesign.yml').read_text(encoding='utf-8')
          m=re.search(r"python - <<'PY'\n(.*?)\n          PY",wf,re.S)
          if not m:
              raise SystemExit('No se encontró el parche preparado')
          code=textwrap.dedent(m.group(1))
          exec(compile(code,'club-redesign-patch.py','exec'))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Club Brinky: tarjeta premium y escaneo QR aplicado"
          git push
