name: Enable Brinky local-first persistence
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'runtime-patch-v8.js'
      - '.github/workflows/enable-local-first-v8.yml'
permissions:
  contents: write
jobs:
  enable:
    if: ${{ !contains(github.event.head_commit.message, 'Enable local-first runtime patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="runtime-patch-v8.js?v=1"></script>'
          if tag not in s:
              marker='</body>'
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable local-first runtime patch'
          git push
