name: Corregir folios desde 80

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-folios-80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-folios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar corrección de folios y renovar caché
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')

          # Identificar esta compilación para evitar que el navegador reutilice JS anterior.
          s = s.replace("const APP_VERSION='2.2.3';", "const APP_VERSION='2.2.4';")

          # Protección adicional: el historial del año actual nunca puede quedar por debajo de 79;
          # de esa forma el siguiente contrato/cotización será 80 como mínimo.
          marker = "function setFolioState(state){localStorage.setItem(FOLIO_STATE_KEY,JSON.stringify(state))}\n"
          guard = """function enforceDocumentFolioFloor(){
  const y=String(new Date().getFullYear());
  const state=getFolioState();
  state.contracts=state.contracts||{};
  state.quotes=state.quotes||{};
  const floor=Math.max(0,DOCUMENT_FOLIO_START-1);
  state.contracts[y]=Math.max(Number(state.contracts[y]||0),floor);
  state.quotes[y]=Math.max(Number(state.quotes[y]||0),floor);
  setFolioState(state);
}
"""
          if 'function enforceDocumentFolioFloor()' not in s:
              if marker not in s:
                  raise SystemExit('No se encontró setFolioState para insertar la protección de folios.')
              s = s.replace(marker, marker + guard, 1)

          startup = "migrateLegacyIfAvailable();\nsyncFolioHistory();"
          startup_fixed = "migrateLegacyIfAvailable();\nenforceDocumentFolioFloor();\nsyncFolioHistory();"
          if startup in s:
              s = s.replace(startup, startup_fixed, 1)
          elif startup_fixed not in s:
              raise SystemExit('No se encontró el bloque de inicio para activar la protección de folios.')

          # La función ya debe aplicar también el piso de 80 en cada cálculo.
          required = "const next=Math.max(highest+1,DOCUMENT_FOLIO_START);"
          if required not in s:
              raise SystemExit('La generación de folios no contiene la protección DOCUMENT_FOLIO_START.')

          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('2.2.3', '2.2.4')
          h = h.replace('Versión 2.2.4 BETA · Folios desde 80', 'Versión 2.2.4 BETA · Folios 80 corregidos')
          index.write_text(h, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('brinky-fiesta-suite-v2-2-3-folios-80', 'brinky-fiesta-suite-v2-2-4-folios-80-fix')
          w = w.replace('v=2.2.3', 'v=2.2.4')
          sw.write_text(w, encoding='utf-8')

      - name: Verificar corrección
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const APP_VERSION='2.2.4';" app.js
          grep -F "const DOCUMENT_FOLIO_START=80" app.js
          grep -F "const next=Math.max(highest+1,DOCUMENT_FOLIO_START);" app.js
          grep -F "function enforceDocumentFolioFloor()" app.js
          grep -F "enforceDocumentFolioFloor();" app.js
          grep -F "Versión 2.2.4 BETA · Folios 80 corregidos" index.html
          grep -F "brinky-fiesta-suite-v2-2-4-folios-80-fix" sw.js

      - name: Publicar corrección
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js
          if git diff --cached --quiet; then
            echo 'La corrección ya estaba aplicada.'
          else
            git commit -m 'Corregir folios desde 80 y renovar caché v2.2.4'
            git push origin HEAD:main
          fi
